<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agelli</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phones; one working view at a time */
:root{
  --bg:#EEF0E6; --surface:#FAFAF4; --surface-2:#E4E8DA; --ink:#1B2A21; --muted:#56655A; --line:#D3D8C6;
  --primary:#1E3B2C; --on-primary:#F3F4EA; --accent:#8F6B00; --accent-soft:#F2E4B4; --on-accent-soft:#4A3800;
  --ok:#2C7A4B; --warn:#A8501C; --warn-soft:#F6DECF;
  --f-brassica:#3F7D5A; --f-allium:#8A5FA8; --f-legume:#B8861A; --f-root:#BC5F2E; --f-leaf:#5C9E36; --f-nightshade:#B23A48; --f-cover:#617687;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#18221B; --surface-2:#223026; --ink:#E9ECE2; --muted:#A0AEA3; --line:#2E3D33;
  --primary:#9FD0B0; --on-primary:#10231A; --accent:#E3C25A; --accent-soft:#3A3218; --on-accent-soft:#F2E2A8;
  --ok:#74C795; --warn:#EE9866; --warn-soft:#3D2418;
  --f-brassica:#6FB58C; --f-allium:#B793D1; --f-legume:#D9AE4A; --f-root:#E08A5A; --f-leaf:#8CCB64; --f-nightshade:#E07280; --f-cover:#93A8B8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#18221B; --surface-2:#223026; --ink:#E9ECE2; --muted:#A0AEA3; --line:#2E3D33;
  --primary:#9FD0B0; --on-primary:#10231A; --accent:#E3C25A; --accent-soft:#3A3218; --on-accent-soft:#F2E2A8;
  --ok:#74C795; --warn:#EE9866; --warn-soft:#3D2418;
  --f-brassica:#6FB58C; --f-allium:#B793D1; --f-legume:#D9AE4A; --f-root:#E08A5A; --f-leaf:#8CCB64; --f-nightshade:#E07280; --f-cover:#93A8B8;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:24px 16px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.rail .demo-note{margin-top:auto;font-size:12.5px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:10px}
main{min-width:0;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 120px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.farm{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--on-accent-soft);display:grid;place-items:center;font-weight:700;flex:none}
.farm small{display:block;color:var(--muted);font-size:13px}
.farm strong{font-weight:600}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.banner{font-size:13px;color:var(--on-accent-soft);background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.h1{font-family:var(--display);font-size:clamp(26px,3.2vw,36px);font-weight:600;letter-spacing:-.015em;line-height:1.15}
.sub{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:16px;font-weight:600}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .head a,.linkbtn{font-size:13px;color:var(--primary);font-weight:600;text-decoration:none;background:none;border:0;padding:0}
.big{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.accent i{background:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.list > *{padding:10px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:0}
.task{display:flex;gap:10px;align-items:flex-start}
.task input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary);flex:none}
.task.done span{text-decoration:line-through;color:var(--muted)}
.alert{background:var(--accent-soft);color:var(--on-accent-soft);border-color:transparent}
.alert .eyebrow{color:var(--on-accent-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.ghost{background:transparent}
.alert .btn{background:transparent;border-color:currentColor;color:inherit}
.alert .btn.primary{background:var(--on-accent-soft);color:var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--on-accent-soft)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--fam);flex:none}
.beds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.beds.tunnel{grid-template-columns:repeat(2,minmax(0,1fr))}
.bed{--fam:var(--f-cover);text-align:left;border:1px solid var(--line);border-left:5px solid var(--fam);border-radius:10px;padding:10px 12px;background:color-mix(in srgb,var(--fam) 13%,var(--surface));display:flex;flex-direction:column;gap:6px;min-width:0}
.bed:hover{border-color:var(--fam)}
.bed[aria-pressed="true"]{outline:2px solid var(--fam);outline-offset:1px}
.bed .id{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em}
.bed .crop{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.bed .bar{height:5px}
.bed .bar i{background:var(--fam)}
.zone{display:flex;flex-direction:column;gap:8px}
.zone h3{font-size:13px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--fam:var(--f-cover);font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--fam);color:var(--ink);background:color-mix(in srgb,var(--fam) 12%,transparent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:72px}
.inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.inline .field{flex:1;min-width:120px}
.suggest{border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface));border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.thread{display:flex;flex-direction:column;gap:8px;cursor:pointer;background:none;border:0;text-align:left;padding:12px 0;width:100%}
.thread h3{font-size:15.5px;font-weight:600}
.answers{display:flex;flex-direction:column;gap:10px;padding:4px 0 6px 14px;border-left:2px solid var(--line)}
.answers b{font-weight:600}
.person{display:flex;gap:10px;align-items:center}
.person .avatar{width:34px;height:34px;font-size:13px;background:var(--surface-2);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 8px 0}
td{padding:10px 8px 10px 0;border-top:1px solid var(--line);vertical-align:middle}
.tablewrap{overflow-x:auto}
.switch{position:relative;width:42px;height:24px;border-radius:99px;border:0;background:var(--line);flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:21px}
.stack{display:flex;flex-direction:column;gap:8px}
.pool-row{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px}
.pool-row .bar{height:12px}
.pool-row.me .bar i{background:var(--accent)}
.bench{display:flex;flex-direction:column;gap:6px}
.bench .bars{display:grid;grid-template-columns:72px 1fr 88px;gap:4px 10px;align-items:center;font-size:13px}
.bench .bar{height:10px}
.bench .peer .bar i{background:var(--muted)}
.locked{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px}
.parcel{display:flex;flex-direction:column;gap:10px}
.match{font-family:var(--display);font-size:30px;font-weight:600;color:var(--primary);line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.roles{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--surface);align-self:flex-start}
.roles button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.roles button svg{width:18px;height:18px}
.roles button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.offer{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--bg);min-width:0}
.offer .farmname{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.offer b{font-weight:600;font-size:15.5px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.star{color:var(--accent);font-size:15px;line-height:1}
.wish{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.wish h3{font-size:17px;font-weight:600}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;font-size:14px}
.alloc .who{display:flex;align-items:center;gap:6px;min-width:0}
.alloc .prio{font-size:11.5px;font-weight:700;color:var(--on-accent-soft);background:var(--accent-soft);border-radius:999px;padding:1px 7px;white-space:nowrap}
.fill{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.fill i{display:block;height:100%}
.fav{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.fav:first-child{border-top:0}
.fav .n{flex:1;min-width:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-weight:700;color:var(--muted);padding:0}
.iconbtn:disabled{opacity:.35;cursor:default}
.bid{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.bid.chosen{border-color:var(--ok)}
.route{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
.route span.stop{padding:3px 9px;border-radius:999px;background:var(--surface-2);font-weight:600}
.route span.end{background:var(--primary);color:var(--on-primary)}
.topr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fieldbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.fieldbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-accent-soft);border-color:var(--accent)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);padding:0}
.bell svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--warn);color:var(--bg);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.banner.field{background:var(--primary);color:var(--on-primary)}
.mic-fab{position:fixed;right:calc(20px + env(safe-area-inset-right, 0px));bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:45;height:56px;border-radius:28px;padding:0 22px 0 18px;border:0;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mic-fab svg{width:24px;height:24px}
.mic-fab.listening{background:var(--warn);color:var(--bg)}
body.fieldmode .mic-fab{height:72px;border-radius:36px;font-size:19px;padding:0 28px 0 22px}
body.fieldmode .mic-fab svg{width:30px;height:30px}
.vsheet{position:fixed;right:calc(16px + env(safe-area-inset-right, 0px));bottom:calc(92px + env(safe-area-inset-bottom, 0px));width:min(430px, calc(100vw - 32px));max-height:calc(100vh - 140px);overflow:auto;z-index:46;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 44px rgba(0,0,0,.28);padding:18px;display:flex;flex-direction:column;gap:12px}
body.fieldmode .vsheet{bottom:calc(108px + env(safe-area-inset-bottom, 0px))}
.npanel{top:calc(72px + env(safe-area-inset-top, 0px));bottom:auto;max-height:calc(100vh - 100px)}
.vset{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.vset input[type=range]{width:100%;accent-color:var(--primary)}
.bigmic{flex:none;width:84px;height:84px;padding:0;border-radius:50%;border:0;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;align-self:center}
.bigmic svg{width:38px;height:38px}
.bigmic.listening{background:var(--warn);color:var(--bg);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn) 45%,transparent)}50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--warn) 0%,transparent)}}
.said{font-size:14px;color:var(--muted)}
.reply{background:var(--accent-soft);color:var(--on-accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.reply .iconbtn{background:transparent;color:inherit;border-color:currentColor}
.iconbtn svg{width:16px;height:16px}
.notif{display:flex;gap:10px;align-items:flex-start}
.notif.unread{font-weight:500}
@media (prefers-reduced-motion: reduce){.bigmic.listening{animation:none}}
.site{background:var(--surface);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
.site section{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.site h3{font-family:var(--display);font-size:19px;font-weight:600;color:var(--primary)}
.site ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.site-hero{background:var(--primary);color:var(--on-primary);padding:22px 20px 0;display:flex;flex-direction:column;gap:6px}
.site-hero h2{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.15}
.site-kicker{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.site-fields{width:100%;height:auto;display:block;margin-top:10px;color:var(--on-primary)}
ul.site-crops{flex-direction:row;flex-wrap:wrap;gap:6px;list-style:none;padding:0}
.site-crops li{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13px}
.site-shares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site-share{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.site-price{font-family:var(--display);font-size:24px;font-weight:600;color:var(--primary)}
.site-form{display:flex;flex-direction:column;gap:10px}
.site-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.site-form label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.site-form input,.site-form select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);font-weight:400;min-width:0}
.site-form label.site-check{flex-direction:row;align-items:center;gap:8px;font-weight:500}
.site-check input{width:18px;height:18px;accent-color:var(--primary)}
.site-form button{align-self:flex-start;background:var(--primary);color:var(--on-primary);border:0;border-radius:10px;padding:10px 18px;font-weight:700}
.site-done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);padding:12px 14px;border-radius:10px;font-weight:600}
.site-foot{font-size:12px;color:var(--muted);padding:12px 20px;border-top:1px solid var(--line)}
.site.full section{padding:24px 32px}
.site.full .site-hero{padding:40px 32px 0}
.site.full .site-hero h2{font-size:40px}
.browser{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.browser-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.browser-bar i{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.browser-bar span{margin-left:8px;background:var(--bg);border-radius:6px;padding:2px 10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#csaPreview{max-height:760px;overflow:auto}
.cropgrid{display:flex;flex-wrap:wrap;gap:6px}
.cropchk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.cropchk input{accent-color:var(--primary)}
.csa-tag{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--accent-soft);color:var(--on-accent-soft);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.csa-strip{grid-column:1/-1}
.tabbar{display:none}
@media (max-width: 1000px){
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 760px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  main{padding-block:14px calc(170px + env(safe-area-inset-bottom, 0px))}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .beds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));justify-content:space-around}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 2px;border-radius:8px;flex:1;min-width:0;text-align:center}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--primary)}
  .pool-row{grid-template-columns:96px 1fr 52px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom, 0px))}
  .mic-fab{bottom:calc(80px + env(safe-area-inset-bottom, 0px))}
  .vsheet{bottom:calc(148px + env(safe-area-inset-bottom, 0px));max-height:calc(100vh - 220px)}
  body.fieldmode .vsheet{bottom:calc(164px + env(safe-area-inset-bottom, 0px))}
  .npanel{top:calc(64px + env(safe-area-inset-top, 0px));bottom:auto}
  .fieldbtn span{display:none}
  .site-shares,.site-grid{grid-template-columns:1fr}
  .tabbar a{font-size:9.5px;overflow:hidden}
  .tabbar a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

function allocate(w){
 const cands=M.offers.filter(o=>o.p===w.p&&o.pr<=w.max&&o.kg>0);
 cands.sort((a,b)=>{const fa=M.favs.indexOf(a.f),fb=M.favs.indexOf(b.f);const ra=fa<0?99:fa,rb=fb<0?99:fb;return ra-rb||FARMS[a.f].km-FARMS[b.f].km});
 let need=w.kg;const out=[];
 for(const o of cands){if(need<=0)break;const take=Math.min(o.kg,need);out.push({f:o.f,kg:take,fav:M.favs.indexOf(o.f)+1,pr:o.pr});need-=take}
 return out;
}

function langVoices(){try{return speechSynthesis.getVoices().filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(S.lang))}catch(e){return []}}
function voiceScore(v){const n=(v.name||'').toLowerCase();let sc=0;
 if(/natural|neural/.test(n))sc+=6;if(/premium/.test(n))sc+=5;if(/enhanced|forbedret|mejorad|improved|siri/.test(n))sc+=4;
 if(/google/.test(n))sc+=2;if(/online/.test(n))sc+=2;if(v.localService===false)sc+=1;
 const want=LOC().toLowerCase();if((v.lang||'').toLowerCase().replace('_','-')===want)sc+=1;if(/compact|eloquence|espeak/.test(n))sc-=3;return sc}
function bestVoice(){const vs=langVoices();if(!vs.length)return null;return vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0]}
function pickVoice(){const vs=langVoices(),u=VP.uri[S.lang];return (u&&vs.find(v=>v.voiceURI===u))||bestVoice()}
function chunks(text){
 const out=[];String(text).replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).forEach(sen=>{
  if(sen.length<=160){out.push(sen);return}
  let cur='';sen.split(/(?<=[,;–])\s+/).forEach(part=>{if((cur+' '+part).trim().length>160&&cur){out.push(cur.trim());cur=part}else cur=(cur+' '+part).trim()});if(cur)out.push(cur)});
 return out.filter(x=>x);
}
function say(text){
 if(!text||!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const v=pickVoice();
  chunks(text).forEach(c=>{const u=new SpeechSynthesisUtterance(c);u.lang=v?v.lang:LOC();u.rate=VP.rate;u.pitch=1;if(v)u.voice=v;speechSynthesis.speak(u)});
 }catch(e){}
}

 return '<div class="vset"><div class="row"><p class="small" style="font-weight:600">'+t('vs_title')+'</p></div>'+
  (vs.length?'<div class="field"><label for="vs-voice" class="small">'+t('vs_voice')+'</label><select class="input" id="vs-voice" data-vs="voice">'+opts+'</select></div>':'<p class="small muted">'+t('vs_none')+'</p>')+

const unread=()=>V.notifs.filter(n=>!n.read);
const NUMW={en:1,et:1,een:1,one:1,uno:1,una:1,to:2,two:2,dos:2,tre:3,three:3,tres:3,fire:4,four:4,cuatro:4,fem:5,five:5,cinco:5,seks:6,six:6,seis:6,syv:7,seven:7,siete:7,otte:8,eight:8,ocho:8,ni:9,nine:9,nueve:9,ti:10,ten:10,diez:10,elleve:11,eleven:11,once:11,tolv:12,twelve:12,doce:12,femten:15,fifteen:15,quince:15,tyve:20,twenty:20,veinte:20};
function numAfter(s,re){const m=s.match(re);if(!m)return null;const w=m[1];return /^\d/.test(w)?parseFloat(w.replace(',','.')):(NUMW[w]??null)}
function tasksReply(){
 const n=S.tasks.length,d=S.tasks.filter(x=>x.done).length,m=n-d;
 const head=tr(`Du har ${n} opgaver i dag. ${d} er klaret, ${m} mangler.`,`You have ${n} tasks today. ${d} done, ${m} to go.`,`Tienes ${n} tareas hoy. ${d} hechas, ${m} pendientes.`);
 const items=S.tasks.map((x,i)=>tr(`Opgave ${i+1}: ${L(x)} – ${x.done?'klaret':'mangler'}.`,`Task ${i+1}: ${L(x)} – ${x.done?'done':'to do'}.`,`Tarea ${i+1}: ${L(x)}: ${x.done?'hecha':'pendiente'}.`));
 return head+' '+items.join(' ');
}
function notifReply(all){
 const list=all?V.notifs:unread();
 if(!list.length)return t('no_notif');
 const head=tr(`Du har ${list.length} nye beskeder.`,`You have ${list.length} new messages.`,`Tienes ${list.length} mensajes nuevos.`);
 const body=list.map((x,i)=>`${i+1}: ${L(x.txt)}`).join(' ');
 list.forEach(x=>x.read=true);
 return head+' '+body;
}
function findBed(s){
 const m=s.match(/\b(?:bed|bede|bancal)?\s*([abct])\s*-?\s*(\d)\b/i);
 if(m){const id=(m[1]+m[2]).toUpperCase();const b=S.beds.find(x=>x.id===id);if(b)return b}
 const ck=Object.keys(CROPS).find(k=>{const nm=L(CROPS[k]).toLowerCase();return s.includes(nm)||nm.split(' ').some(w=>w.length>4&&s.includes(w))});
 if(ck){const bs=S.beds.filter(b=>b.c===ck);return bs.find(b=>b.plan>0)||bs[0]||null}
 return null;
}
function handle(raw){
 const s=raw.toLowerCase().replace(/[“”"?!]/g,'').trim();
 if(!s)return '';
 if(/\b(hjælp|help|ayuda)\b/.test(s)) return tr('Du kan sige: læs dagens opgaver. Høstet 12 kilo grønkål i bed A1. Opgave 3 er færdig. Notér i bed B3, bladlus på spinaten. Eller: læs mine beskeder.','You can say: read today’s tasks. Harvested 12 kilos of kale in bed A1. Task 3 is done. Note in bed B3, aphids on the spinach. Or: read my messages.','Puedes decir: lee las tareas de hoy. Cosechados 12 kilos de col rizada en el bancal A1. La tarea 3 está hecha. Anota en el bancal B3, pulgones en las espinacas. O bien: lee mis mensajes.');
 if(/(markmode|field mode|modo campo)/.test(s)){V.field=!/(slå fra|sluk|\boff\b|desactiva|apaga)/.test(s);fieldTimer();return V.field?t('field_on'):t('field_off')}
 if(/(notér|noter|notat|observation|\bnote\b|anota|nota\b|observa)/.test(s)){
  const b=findBed(s)||S.beds.find(x=>x.id===S.sel);
  let txt=raw.includes(':')?raw.slice(raw.indexOf(':')+1).trim():raw.replace(/^.*?\b(?:bed|bancal)\s*[a-dt]\s*\d\b[,\s]*/i,'').trim();
  if(!txt||txt.toLowerCase()===s)txt=raw;
  b.obs.unshift(txt);S.sel=b.id;
  return tr(`Observation gemt i bed ${b.id}: ${txt}.`,`Observation saved in bed ${b.id}: ${txt}.`,`Observación guardada en el bancal ${b.id}: ${txt}.`);
 }
 if(/(færdig|klaret|klar med|udført|afsluttet|\bdone\b|finished|complete|hecha|hecho|terminad|completad)/.test(s)){
  let i=numAfter(s,/(?:opgave|opgaven|task|tarea|nummer|number|número)\s+(?:nr\.?\s*)?(\d+|[a-zæøåéíóú]+)/);
  let x=i?S.tasks[i-1]:null;
  if(!x){const words=s.split(/\s+/).filter(w=>w.length>4);x=S.tasks.find(tk=>words.some(w=>L(tk).toLowerCase().includes(w)));i=x?S.tasks.indexOf(x)+1:null}
  if(!x)return tr('Hvilken opgave? Sig fx: opgave 2 er færdig.','Which task? Say e.g.: task 2 is done.','¿Qué tarea? Di p. ej.: la tarea 2 está hecha.');
  if(x.done)return tr(`Opgave ${i} var allerede klaret.`,`Task ${i} was already done.`,`La tarea ${i} ya estaba hecha.`);
  x.done=true;const m=S.tasks.filter(t=>!t.done).length;
  return tr(`Opgave ${i} er markeret som klaret: ${L(x)}. Der mangler ${m}.`,`Task ${i} marked as done: ${L(x)}. ${m} to go.`,`Tarea ${i} marcada como hecha: ${L(x)}. Quedan ${m}.`);
 }
 const kg=numAfter(s,/(\d+(?:[.,]\d+)?)\s*(?:kilo|kg)/)??numAfter(s,/\b([a-zæøåéíóú]+)\s+(?:kilo|kg)/);
 if(/(høst|harvest|cosech|kilo|\bkg\b)/.test(s)){
  if(!kg)return tr('Hvor meget? Sig fx: høstet 12 kilo grønkål i bed A1.','How much? Say e.g.: harvested 12 kilos of kale in bed A1.','¿Cuánto? Di p. ej.: cosechados 12 kilos de col rizada en el bancal A1.');
  const b=findBed(s);
  if(!b)return tr('Hvilket bed? Sig fx: høstet 12 kilo i bed A1.','Which bed? Say e.g.: harvested 12 kilos in bed A1.','¿Qué bancal? Di p. ej.: cosechados 12 kilos en el bancal A1.');
  b.h=Math.round((b.h+kg)*10)/10;S.sel=b.id;const c=L(CROPS[b.c]).toLowerCase();
  const pl=b.plan?tr(` Høstet i alt ${nf(b.h,1)} af ${nf(b.plan)} kilo, ${Math.round(b.h/b.plan*100)} procent af planen.`,` ${nf(b.h,1)} of ${nf(b.plan)} kilos harvested in total, ${Math.round(b.h/b.plan*100)} percent of plan.`,` En total ${nf(b.h,1)} de ${nf(b.plan)} kilos, el ${Math.round(b.h/b.plan*100)} por ciento del plan.`):'';
  return tr(`Registreret ${nf(kg,1)} kilo ${c} i bed ${b.id}.`,`Recorded ${nf(kg,1)} kilos of ${c} in bed ${b.id}.`,`Registrados ${nf(kg,1)} kilos de ${c} en el bancal ${b.id}.`)+pl;
 }
 if(/(csa|kasse|kasser|andel|box|boxes|caja|cajas|cuota)/.test(s)) return csaReply();
 if(/(opgave|to-do|todo|gøremål|i dag|dagens|task|today|tarea|hoy|pendiente)/.test(s)) return tasksReply();
 if(/(besked|notifikation|meddelelse|nyheder|message|notification|alert|mensaje|aviso|notific)/.test(s)) return notifReply(false);
 return tr('Det forstod jeg ikke helt. Sig “hjælp” for at høre, hvad du kan sige.','I didn’t quite get that. Say “help” to hear what you can say.','No lo he entendido bien. Di “ayuda” para oír lo que puedes decir.');
}
function runCommand(text){
 if(V.listening){V.listening=false;try{rec&&rec.abort()}catch(e){}}
 V.said=text;V.reply=handle(text);V.open=true;
 render(true);say(V.reply);
}
function listen(){
 if(V.listening){try{rec&&rec.stop()}catch(e){}V.listening=false;renderVoice();return}
 if(!SR){V.micBlocked=true;renderVoice();return}
 hush();
 try{
  rec=new SR();rec.lang=LOC();rec.interimResults=true;rec.maxAlternatives=1;
  rec.onresult=e=>{let fin='',tmp='';for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else tmp+=r[0].transcript}
   if(fin){V.listening=false;runCommand(fin.trim())}else{V.said=tmp;renderVoice()}};
  rec.onerror=e=>{V.listening=false;if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture')V.micBlocked=true;renderVoice()};
  rec.onend=()=>{if(V.listening){V.listening=false;renderVoice()}};
  rec.start();V.listening=true;V.micBlocked=false;V.said='';
 }catch(e){V.listening=false;V.micBlocked=true}
 renderVoice();
}
function pushNotif(){
 const n=V.sim[V.simIdx%V.sim.length];V.simIdx++;
 const d=new Date();const tm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
 const item={id:Date.now(),k:n.k,tm,read:false,txt:n.txt};V.notifs.unshift(item);
 if(V.field){item.read=true;say(t('new_msg')+'. '+L(n.txt))}
 toast(t('new_msg')+': '+L(n.txt));renderVoice();
}
function fieldTimer(){clearInterval(V.timer);V.timer=null;if(V.field)V.timer=setInterval(()=>{if(V.simIdx<V.sim.length)pushNotif();else{clearInterval(V.timer);V.timer=null}},25000)}
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const NK={alert:'Warning',order:'PaperPlane',community:'Chat',transport:'Globe'};
function renderVoice(){
 document.body.classList.toggle('fieldmode',V.field);
 const fb=document.getElementById('fieldBtn');fb.setAttribute('aria-pressed',V.field);fb.querySelector('span').textContent=t('field_mode');
 const u=unread().length,bc=document.getElementById('bellCount');bc.textContent=u;bc.hidden=!u;
 document.getElementById('vsBtn').setAttribute('aria-label',t('vs_settings'));document.getElementById('vsBtn').setAttribute('title',t('vs_settings'));
 document.getElementById('bell').setAttribute('aria-label',t('notif_title')+(u?' ('+u+')':''));
 const fab=document.getElementById('micFab');fab.classList.toggle('listening',V.listening);fab.setAttribute('aria-expanded',V.open);
 fab.innerHTML=MIC+'<span>'+(V.listening?t('stop'):t('voice_btn'))+'</span>';
 const fbn=document.getElementById('fieldBanner');fbn.hidden=!V.field;fbn.textContent=t('field_banner');
 const vs=document.getElementById('vsheet');vs.hidden=!V.open;
 if(V.open){
  vs.innerHTML='<div class="row"><h2 id="vs-title" style="font-family:var(--display);font-size:22px;font-weight:600">'+t('voice_title')+'</h2><button class="iconbtn" data-vc="close" aria-label="'+t('close')+'">×</button></div>'+
  '<button class="bigmic'+(V.listening?' listening':'')+'" data-vc="listen" aria-label="'+(V.listening?t('stop'):t('tap_to_talk'))+'">'+MIC+'</button>'+
  '<p class="small muted" style="text-align:center" aria-live="polite">'+(V.listening?t('listening'):t('tap_to_talk'))+'</p>'+
  (V.micBlocked?'<p class="locked small">'+t('mic_na')+'</p>':'')+
  (V.said?'<p class="said"><b>'+t('you_said')+':</b> “'+esc(V.said)+'”</p>':'')+
  (V.reply?'<div class="reply" aria-live="polite"><p style="flex:1">'+esc(V.reply)+'</p><button class="iconbtn" data-vc="replay" aria-label="'+t('replay')+'">'+SPK+'</button></div>':'')+
  '<form class="inline" data-vcform="cmd"><div class="field"><label for="vc-text">'+t('type_cmd')+'</label><input class="input" id="vc-text" autocomplete="off"></div><button class="btn primary" type="submit">'+t('send')+'</button></form>'+
  '<div class="stack"><p class="small" style="font-weight:600">'+t('examples')+'</p><div class="filters">'+EXAMPLES[S.lang].map((x,i)=>'<button data-vc="ex" data-i="'+i+'">'+esc(x)+'</button>').join('')+'</div></div>'+
  '<button class="linkbtn" style="align-self:flex-start" data-vc="vsettings" aria-expanded="'+VP.showSettings+'">'+(VP.showSettings?'▾ ':'▸ ')+t('vs_settings')+'</button>'+(VP.showSettings?voiceSettingsHTML():'');
 }
 const np=document.getElementById('npanel');np.hidden=!V.npanel;
 if(V.npanel){
  np.innerHTML='<div class="row"><h2 style="font-family:var(--display);font-size:22px;font-weight:600">'+t('notif_title')+'</h2><button class="iconbtn" data-vc="nclose" aria-label="'+t('close')+'">×</button></div>'+
  '<div class="btns"><button class="btn primary" data-vc="readnew">'+SPK.replace('<svg','<svg width="16" height="16"')+' '+t('read_all')+'</button><button class="btn" data-vc="sim">'+t('simulate')+'</button></div>'+
  '<div class="list">'+V.notifs.map(n=>'<div class="notif'+(n.read?'':' unread')+'"><span style="flex:1;min-width:0"><span class="small muted">'+n.tm+(n.read?'':' · <b style="color:var(--warn)">●</b>')+'</span><br>'+esc(L(n.txt))+'</span><button class="iconbtn" data-vc="readone" data-id="'+n.id+'" aria-label="'+t('read_aloud')+'">'+SPK+'</button></div>').join('')+'</div>';
 }
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-vc]');if(!el)return;
 const a=el.dataset.vc;
 if(a==='open'){if(!V.open){V.open=true;V.npanel=false;listen()}else if(V.listening){listen()}else{V.open=false;hush()}renderVoice();return}
 if(a==='close'){V.open=false;if(V.listening)listen();hush()}
 else if(a==='vsettings'){VP.showSettings=!VP.showSettings}
 else if(a==='vsopen'){V.open=true;V.npanel=false;VP.showSettings=true;renderVoice();const el=document.getElementById('vs-voice')||document.getElementById('vs-rate');if(el)el.scrollIntoView({block:'center'});return}
 else if(a==='vstest'){say(t('vs_sample'));return}
 else if(a==='vsreset'){delete VP.uri[S.lang];saveVP()}
 else if(a==='listen')listen();
 else if(a==='replay')say(V.reply);
 else if(a==='ex'){runCommand(EXAMPLES[S.lang][+el.dataset.i]);return}
 else if(a==='bell'){V.npanel=!V.npanel;if(V.npanel)V.open=false}
 else if(a==='nclose'){V.npanel=false;hush()}
 else if(a==='readnew'){const r=notifReply(false);say(r);render(true)}
 else if(a==='readone'){const n=V.notifs.find(x=>x.id==el.dataset.id);if(n){n.read=true;say(L(n.txt))}}
 else if(a==='sim')pushNotif();
 else if(a==='field'){V.field=!V.field;fieldTimer();say(V.field?t('field_on'):t('field_off'));toast(V.field?t('field_on'):t('field_off'))}
 else if(a==='readtasks'){say(tasksReply());return}
 renderVoice();
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-vcform]');if(!f)return;e.preventDefault();
 const v=document.getElementById('vc-text').value.trim();if(v)runCommand(v);
});
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{if(V.open&&VP.showSettings)renderVoice()}}catch(e){}
document.addEventListener('change',e=>{const el=e.target.closest('[data-vs]');if(!el)return;if(el.dataset.vs==='voice'){VP.uri[S.lang]=el.value;saveVP();say(t('vs_sample'))}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-vs="rate"]');if(!el)return;VP.rate=parseFloat(el.value)||1;saveVP();const l=el.closest('.field').querySelector('label span');if(l)l.textContent=nf(VP.rate,2)+'×'});
document.addEventListener('change',e=>{if(e.target.closest('[data-vs="rate"]'))say(t('vs_sample'))});

const CSA={on:true,name:null,desc:null,pickup:null,terms:null,w1:22,w2:47,small:2400,large:3900,max:40,
 crops:['kale','leek','carrot','beet','salad','spinach','tomato','onion','pea','chard','parsnip','garlic'],
 members:{small:18,large:10},wait:0,paidPct:89,sent:null,
 recent:[{n:'Mette L.',s:'large',d:'4/11'},{n:'Jonas P.',s:'small',d:'1/11'},{n:'Aisha K.',s:'small',d:'29/10'}],
 box:[{c:'kale',s:0.5,l:1},{c:'leek',s:0.75,l:1.5},{c:'carrot',s:1,l:2},{c:'beet',s:0.75,l:1.5},{c:'salad',s:0.25,l:0.5}],
 swaps:{}};
const CSA_DEF={
 name:{da:'Kildegårdens Grøntsagsandel',en:'Kildegården Vegetable Share',es:'Cuota de verduras de Kildegården'},
 desc:{da:'Kildegården er en lille regenerativ gård på 3,2 hektar. Vi dyrker over 40 slags grøntsager uden sprøjtemidler og kunstgødning, med levende jorddække og minimal jordbearbejdning. Som medlem får du en kasse med det bedste fra marken hver uge – og du er velkommen til at kigge forbi.',
  en:'Kildegården is a small regenerative farm of 3.2 hectares. We grow more than 40 kinds of vegetables without pesticides or synthetic fertiliser, with living ground cover and minimal tillage. As a member you get a box of the best from the field every week – and you’re welcome to visit.',
  es:'Kildegården es una pequeña finca regenerativa de 3,2 hectáreas. Cultivamos más de 40 tipos de hortalizas sin pesticidas ni abonos sintéticos, con cubierta vegetal viva y laboreo mínimo. Como socio recibes cada semana una caja con lo mejor del campo, y puedes venir a visitarnos cuando quieras.'},
 pickup:{da:'Gården, torsdag kl. 15–18 · Byens Madhus, fredag kl. 10–14',en:'The farm, Thursday 3–6 pm · Byens Madhus, Friday 10 am–2 pm',es:'La finca, jueves de 15 a 18 h · Byens Madhus, viernes de 10 a 14 h'},
 terms:{da:'Andelen betales forud for hele sæsonen eller i to rater.\nIndholdet følger sæsonen og vejret – nogle uger er der mere, andre mindre.\nKassen hentes på det valgte sted; uafhentede kasser går til madspildsprojekt.\nBesked om ferie senest mandag, så springer vi ugen over.\nMedlemskabet gælder én sæson og kan ikke refunderes, men kan overdrages.',
  en:'The share is paid in advance for the whole season or in two instalments.\nThe contents follow the season and the weather – some weeks there is more, others less.\nThe box is collected at the chosen place; uncollected boxes go to a food-waste project.\nTell us about holidays by Monday and we’ll skip that week.\nMembership covers one season and is non-refundable, but can be transferred.',
  es:'La cuota se paga por adelantado para toda la temporada o en dos plazos.\nEl contenido sigue la temporada y el tiempo: algunas semanas hay más y otras menos.\nLa caja se recoge en el lugar elegido; las cajas no recogidas van a un proyecto contra el desperdicio.\nAvisa de tus vacaciones antes del lunes y saltamos esa semana.\nLa cuota es para una temporada y no se reembolsa, pero se puede ceder.'}};
const cv=k=>CSA[k]!=null?CSA[k]:L(CSA_DEF[k]);
const csaCount=()=>CSA.members.small+CSA.members.large;
const csaWeeks=()=>Math.max(1,CSA.w2-CSA.w1+1);
const STORE={kale:38,leek:62,beet:120};
function cropAvail(c){let r=0;S.beds.filter(b=>b.c===c&&b.plan>0).forEach(b=>r+=Math.max(0,b.plan-b.h));return Math.round((r+(STORE[c]||0))*10)/10}
function boxRows(){
 return CSA.box.map(x=>{const c=CSA.swaps[x.c]||x.c;const need=Math.round((CSA.members.small*x.s+CSA.members.large*x.l)*10)/10;const av=cropAvail(c);
  let alt=null;if(av<need){alt=Object.keys(CROPS).filter(k=>k!==c&&CSA.crops.includes(k)&&!CSA.box.some(y=>(CSA.swaps[y.c]||y.c)===k)&&CROPS[k].f===CROPS[c].f).map(k=>({k,av:cropAvail(k)})).filter(o=>o.av>=need).sort((a,b)=>b.av-a.av)[0]||null}
  return {orig:x.c,c,need,av,ok:av>=need,alt,swapped:!!CSA.swaps[x.c]}});
}
function csaReply(){
 if(!CSA.on)return t('csa_off')+'.';
 const r=boxRows(),bad=r.filter(x=>!x.ok);
 const head=tr(`I denne uge skal der pakkes ${csaCount()} CSA-kasser: ${CSA.members.small} små og ${CSA.members.large} store.`,`This week ${csaCount()} CSA boxes need packing: ${CSA.members.small} small and ${CSA.members.large} large.`,`Esta semana hay que preparar ${csaCount()} cajas CSA: ${CSA.members.small} pequeñas y ${CSA.members.large} grandes.`);
 const items=r.map(x=>`${L(CROPS[x.c])} ${nf(x.need,1)} kg`).join(', ');
 const warn=bad.length?' '+bad.map(x=>tr(`Der mangler ${nf(x.need-x.av,1)} kilo ${L(CROPS[x.c]).toLowerCase()}`,`${nf(x.need-x.av,1)} kilos of ${L(CROPS[x.c]).toLowerCase()} are missing`,`Faltan ${nf(x.need-x.av,1)} kilos de ${L(CROPS[x.c]).toLowerCase()}`)+(x.alt?tr(` – byt evt. til ${L(CROPS[x.alt.k]).toLowerCase()}.`,` – consider swapping for ${L(CROPS[x.alt.k]).toLowerCase()}.`,` – puedes cambiarla por ${L(CROPS[x.alt.k]).toLowerCase()}.`):'.')).join(' '):' '+t('all_ready')+'.';
 return head+' '+tr('Indhold','Contents','Contenido')+': '+items+'.'+warn;
}
function csaBoxCard(compact){
 const r=boxRows(),bad=r.filter(x=>!x.ok).length;
 if(compact) return '<section class="card csa-strip"><div class="row" style="flex-wrap:wrap;gap:12px 24px"><div class="row" style="gap:14px;flex-wrap:wrap"><span class="big">'+csaCount()+'</span><span><b style="font-weight:600">CSA · '+t('boxes')+' '+tr('i uge 45','in week 45','en la semana 45')+'</b><br><span class="small muted">'+CSA.members.small+' '+t('small').toLowerCase()+' · '+CSA.members.large+' '+t('large').toLowerCase()+' · '+t('pack_day')+'</span></span></div><span class="row" style="gap:12px;flex-wrap:wrap">'+(bad?'<span class="pill warn">'+bad+' '+t('missing_items')+'</span><a class="linkbtn" href="#plan">'+t('open_plan')+'</a>':'<span class="pill ok">'+t('all_ready')+'</span>')+'<a class="linkbtn" href="#csa">'+t('open_csa')+'</a></span></div></section>';
 const rows=r.map(x=>'<tr><td style="font-weight:500"><span class="dot" style="display:inline-block;'+famVar(CROPS[x.c].f)+'"></span> '+L(CROPS[x.c])+(x.swapped?' <span class="pill">'+t('swapped')+'</span>':'')+'</td><td class="num">'+nf(x.need,1)+' kg</td><td class="num">'+nf(x.av,1)+' kg</td><td>'+(x.ok?'<span class="pill ok">'+t('enough')+'</span>':'<span class="pill warn">'+t('short')+' '+nf(x.need-x.av,1)+' kg</span>'+(x.alt?' <button class="btn" data-csa="swap" data-c="'+x.orig+'" data-to="'+x.alt.k+'">'+t('swap')+' '+L(CROPS[x.alt.k]).toLowerCase()+'</button>':''))+'</td></tr>').join('');
 return '<section class="card"><div class="head"><h2>'+t('box_title')+' · '+csaCount()+' '+t('boxes')+'</h2><a href="#csa">'+t('open_csa')+'</a></div><p class="small muted">'+t('box_sub')+'</p><div class="tablewrap"><table><thead><tr><th>'+tr('Råvare','Produce','Producto')+'</th><th>'+t('need')+'</th><th>'+t('avail')+'</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}
function siteHTML(full){
 const left=CSA.max-csaCount(),wk=csaWeeks();
 const crops=CSA.crops.map(k=>'<li>'+esc(L(CROPS[k]))+'</li>').join('');
 const terms=cv('terms').split('\n').filter(x=>x.trim()).map(x=>'<li>'+esc(x)+'</li>').join('');
 const share=(k,price,d)=>'<div class="site-share"><b>'+t(k)+'</b><span class="small">'+t(d)+'</span><span class="site-price num">'+kr(price)+'</span><span class="small">'+t('per_season')+' · '+kr(Math.round(price/wk))+' '+t('per_week')+'</span></div>';
 const form=CSA.sent?'<p class="site-done" role="status">'+(CSA.sent==='wait'?t('s_wait'):t('s_thanks'))+'</p>':
  '<form class="site-form" data-csaform="signup"><div class="site-grid"><label>'+t('s_name')+'<input id="su-name" required autocomplete="off"></label><label>'+t('s_email')+'<input id="su-email" type="email" required autocomplete="off"></label><label>'+t('s_phone')+'<input id="su-phone" autocomplete="off"></label><label>'+t('s_size')+'<select id="su-size"><option value="small">'+t('small')+' – '+kr(CSA.small)+'</option><option value="large">'+t('large')+' – '+kr(CSA.large)+'</option></select></label></div><label class="site-check"><input type="checkbox" id="su-accept" required> '+t('s_accept')+'</label><button type="submit">'+(left>0?t('s_submit'):t('s_full'))+'</button></form>';
 return '<div class="site'+(full?' full':'')+'">'+
  '<header class="site-hero"><p class="site-kicker">CSA · '+t('s_season')+' '+CSA.w1+'–'+CSA.w2+'</p><h2>'+esc(cv('name'))+'</h2><p>'+(left>0?left+' '+t('s_spots'):t('s_full'))+'</p><svg viewBox="0 0 400 60" aria-hidden="true" class="site-fields"><path d="M0 40 C80 20 160 50 240 30 S360 20 400 35 V60 H0z" fill="currentColor" opacity=".25"/><path d="M0 50 C100 35 200 58 300 42 S380 40 400 46 V60 H0z" fill="currentColor" opacity=".35"/></svg></header>'+
  '<section><h3>'+t('s_about')+'</h3><p>'+esc(cv('desc'))+'</p></section>'+
  '<section><h3>'+t('s_get')+'</h3><ul class="site-crops">'+crops+'</ul></section>'+
  '<section><h3>'+t('s_shares')+'</h3><div class="site-shares">'+share('small',CSA.small,'share_small_d')+share('large',CSA.large,'share_large_d')+'</div></section>'+
  '<section><h3>'+t('s_pickup')+'</h3><p>'+esc(cv('pickup'))+'</p></section>'+
  '<section><h3>'+t('s_terms')+'</h3><ul>'+terms+'</ul></section>'+
  '<section class="site-signup"><h3>'+t('s_signup')+'</h3>'+form+'</section>'+
  '<p class="site-foot">'+t('s_demo')+'</p></div>';
}
function vCsa(){
 if(!CSA.on) return '<div><p class="eyebrow">'+t('nav_csa')+'</p><h1 class="h1">'+t('csa_title')+'</h1><p class="sub" style="max-width:70ch">'+t('csa_sub')+'</p></div><section class="card" style="max-width:640px"><h2>'+t('csa_start_t')+'</h2><p>'+t('csa_start')+'</p><button class="btn primary" style="align-self:flex-start" data-csa="toggle">'+t('csa_enable')+'</button></section>';
 const n=csaCount(),pct=Math.min(100,n/CSA.max*100);
 const crops=['kale','cabbage','leek','garlic','onion','bean','pea','carrot','beet','parsnip','spinach','salad','chard','tomato','potato'].map(k=>'<label class="cropchk"><input type="checkbox" data-csa="crop" data-c="'+k+'"'+(CSA.crops.includes(k)?' checked':'')+'> '+L(CROPS[k])+'</label>').join('');
 const fld=(id,label,val,type)=>'<div class="field"><label for="csa-'+id+'">'+label+'</label>'+(type==='area'?'<textarea class="input" id="csa-'+id+'" data-csa-field="'+id+'" rows="'+(id==='terms'?6:4)+'">'+esc(val)+'</textarea>':'<input class="input'+(type==='number'?' num':'')+'" id="csa-'+id+'" data-csa-field="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'">')+'</div>';
 return '<div class="row" style="align-items:flex-end;flex-wrap:wrap"><div><p class="eyebrow">'+t('nav_csa')+'</p><h1 class="h1">'+t('csa_title')+'</h1><p class="sub" style="max-width:70ch">'+t('csa_sub')+'</p></div><label class="row" style="gap:10px;font-weight:600">'+t('csa_toggle')+'<button class="switch" role="switch" aria-checked="true" aria-label="'+t('csa_toggle')+'" data-csa="toggle"></button></label></div>'+
 '<div class="grid g3">'+
  '<section class="card"><div class="head"><h2>'+t('members')+'</h2><span class="small muted num">'+n+' / '+CSA.max+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><p class="small muted">'+CSA.members.small+' '+t('small').toLowerCase()+' · '+CSA.members.large+' '+t('large').toLowerCase()+(CSA.wait?' · '+CSA.wait+' '+t('waitlist'):'')+'</p><p class="small"><span class="pill ok">'+CSA.paidPct+' % '+t('paid')+'</span></p></section>'+
  '<section class="card"><h2>'+tr('Indtægt for sæsonen','Season revenue','Ingresos de la temporada')+'</h2><p class="big">'+kr(CSA.members.small*CSA.small+CSA.members.large*CSA.large)+'</p><p class="small muted">'+tr('betalt forud – før første høst','paid up front – before the first harvest','pagado por adelantado, antes de la primera cosecha')+'</p></section>'+
  '<section class="card"><h2>'+t('recent')+'</h2><div class="list">'+CSA.recent.slice(0,3).map(m=>'<div class="row"><span>'+esc(m.n)+'</span><span class="small muted">'+t(m.s)+' · '+esc(m.d)+'</span></div>').join('')+'</div></section>'+
 '</div>'+
 csaBoxCard(false)+
 '<div class="split" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">'+
  '<section class="card"><h2>'+t('setup')+'</h2>'+fld('name',t('f_name'),cv('name'))+fld('desc',t('f_desc'),cv('desc'),'area')+
   '<div class="grid g2" style="gap:10px">'+fld('w1',t('f_season')+' · '+tr('fra','from','de'),CSA.w1,'number')+fld('w2',tr('til','to','a'),CSA.w2,'number')+fld('small',t('f_small'),CSA.small,'number')+fld('large',t('f_large'),CSA.large,'number')+'</div>'+
   fld('max',t('f_max'),CSA.max,'number')+fld('pickup',t('f_pickup'),cv('pickup'))+fld('terms',t('f_terms'),cv('terms'),'area')+
   '<div class="field"><span class="small" style="font-weight:600">'+t('f_crops')+'</span><div class="cropgrid">'+crops+'</div></div></section>'+
  '<section class="card"><div class="head"><h2>'+t('site')+'</h2><a href="#csa-site">'+t('open_site')+'</a></div><div class="browser"><div class="browser-bar"><i></i><i></i><i></i><span>kildegaarden.agelli.dk/csa</span></div><div id="csaPreview">'+siteHTML(false)+'</div></div></section>'+
 '</div>';
}
function vCsaSite(){return '<p><a class="linkbtn" href="#csa">← '+t('back_app')+'</a></p><div class="browser"><div class="browser-bar"><i></i><i></i><i></i><span>kildegaarden.agelli.dk/csa</span></div>'+siteHTML(true)+'</div>'}
document.addEventListener('input',e=>{
 const el=e.target.closest('[data-csa-field]');if(!el)return;
 const k=el.dataset.csaField,num=['w1','w2','small','large','max'].includes(k);
 CSA[k]=num?Math.max(0,parseInt(el.value,10)||0):el.value;
 const p=document.getElementById('csaPreview');if(p)p.innerHTML=siteHTML(false);
});
document.addEventListener('change',e=>{if(e.target.closest('[data-csa-field]'))render(true)});
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-csa]');if(!el)return;
 const a=el.dataset.csa;
 if(a==='toggle'){CSA.on=!CSA.on;toast(CSA.on?t('csa_on'):t('csa_off'))}
 else if(a==='crop'){const c=el.dataset.c;CSA.crops=el.checked?[...new Set([...CSA.crops,c])]:CSA.crops.filter(x=>x!==c)}
 else if(a==='swap'){CSA.swaps[el.dataset.c]=el.dataset.to;toast(t('swapped')+': '+L(CROPS[el.dataset.to]))}
 render(true);
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-csaform]');if(!f)return;e.preventDefault();
 const name=document.getElementById('su-name').value.trim(),size=document.getElementById('su-size').value;if(!name)return;
 if(csaCount()<CSA.max){CSA.members[size]++;CSA.sent='ok';
  const d=new Date();CSA.recent.unshift({n:name,s:size,d:d.getDate()+'/'+(d.getMonth()+1)});
  const msg={da:`Ny CSA-tilmelding: ${name}, ${size==='small'?'lille':'stor'} andel.`,en:`New CSA sign-up: ${name}, ${size} share.`,es:`Nueva inscripción CSA: ${name}, cuota ${size==='small'?'pequeña':'grande'}.`};
  V.notifs.unshift({id:Date.now(),k:'order',tm:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),read:false,txt:msg});
  if(V.field)say(L(msg));toast(t('new_member')+': '+name);
 }else{CSA.wait++;CSA.sent='wait'}
 render(true);
 setTimeout(()=>{CSA.sent=null;},6000);
});

function csaSync(){const x=S.tasks.find(k=>k.id===3);if(x&&CSA.on){x.da='Pak '+csaCount()+' CSA-kasser';x.en='Pack '+csaCount()+' CSA boxes';x.es='Preparar '+csaCount()+' cajas CSA'}}
EXAMPLES.da.splice(5,0,'Hvor mange CSA-kasser i denne uge?');EXAMPLES.en.splice(5,0,'How many CSA boxes this week?');EXAMPLES.es.splice(5,0,'¿Cuántas cajas CSA esta semana?');

const VIEWS={overblik:vOverblik,plan:vPlan,csa:vCsa,'csa-site':vCsaSite,faellesskab:vCom,afsaetning:vMarket,marked:vMarked,noegletal:vNum,jord:vLand};
function render(keepScroll){
 csaSync();
 chrome();
 const y=window.scrollY;
 document.getElementById('view').innerHTML=VIEWS[route()]();
 if(keepScroll) window.scrollTo(0,y);
 renderVoice();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');
 if(lb){S.lang=lb.dataset.lang;try{localStorage.setItem('ff-lang',S.lang)}catch(_){ }render(true);return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,i=+el.dataset.i;
 if(a==='task'){const x=S.tasks.find(x=>x.id==id);x.done=el.checked;render(true);return}
 if(a==='alert-add'){S.alert='added';S.tasks.push({id:Date.now(),da:'Dæk T2 og B3 med fiberdug før onsdag',en:'Cover T2 and B3 with fleece before Wednesday',done:false});toast(t('alert_added'))}
 else if(a==='alert-dismiss'){S.alert='dismissed'}
 else if(a==='bed'){S.sel=id;if(window.innerWidth<1000){render(true);const p=document.querySelector('[aria-live="polite"]');if(p)p.scrollIntoView({behavior:'smooth',block:'start'});return}}
 else if(a==='suggest'){const b=S.beds.find(x=>x.id===S.sel);const used=b.hist.slice(0,3).map(h=>CROPS[h].f).concat(CROPS[b.c].f);
   let f=ROT[(ROT.indexOf(CROPS[b.c].f)+1)%ROT.length];let n=0;while(used.includes(f)&&n<ROT.length){f=ROT[(ROT.indexOf(f)+1)%ROT.length];n++}
   S.suggest={bed:b.id,crop:FAMCROP[f]}}
 else if(a==='thread'){const x=S.threads.find(x=>x.id==id);x.open=!x.open}
 else if(a==='mentor'){S.mentors[i].done=true;toast(t('sent'))}
 else if(a==='event'){S.events[i].on=!S.events[i].on}
 else if(a==='accept'){S.orders.find(o=>o.id==id).st='accepted';toast(t('accepted'))}
 else if(a==='web'){const p=S.products.find(p=>p.id===id);p.web=!p.web}
 else if(a==='share'){S.share=!S.share}
 else if(a==='interest'){S.parcels[i].on=!S.parcels[i].on;if(S.parcels[i].on)toast(t('interested'))}
 else if(a==='layout'){S.parcels[i].show=!S.parcels[i].show}
 render(true);
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
 const k=f.dataset.form;
 if(k==='harvest'){const v=parseFloat(document.getElementById('hv-kg').value);if(!(v>0))return;const b=S.beds.find(x=>x.id===S.sel);b.h=Math.round((b.h+v)*10)/10;toast(t('saved_h')+': '+nf(v,1)+' kg · '+b.id)}
 else if(k==='obs'){const v=document.getElementById('obs-text').value.trim();if(!v)return;S.beds.find(x=>x.id===S.sel).obs.unshift(v);toast(t('saved_o'))}
 else if(k==='ask'){const v=document.getElementById('ask-q').value.trim();if(!v)return;const tag=document.getElementById('ask-tag').value;
   S.threads.unshift({id:Date.now(),q:{da:v,en:v},who:t('you'),meta:{da:'Kildegården',en:'Kildegården'},tag,open:true,a:[]})}
 else if(k==='pool'){const v=Math.max(0,Math.min(200,parseInt(document.getElementById('pool-kg').value,10)||0));S.pool.farms.find(x=>x.me).kg=v}
 render(true);
});
window.addEventListener('hashchange',()=>{render(false);window.scrollTo(0,0)});
render(false);
})();
</script>
